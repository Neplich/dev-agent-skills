name: Manual Evals

"on":
  workflow_dispatch:
    inputs:
      target:
        description: "Agent suite to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - designer
          - devops
          - docs
          - engineer
          - product_manager
          - qa
          - security
      skill:
        description: "Optional exact skill name"
        required: false
        type: string
      eval_id:
        description: "Optional exact eval ID (requires skill)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  paired-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CODEX_HOME: /tmp/codex-home
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::Set the OPENAI_API_KEY repository secret before running evals."
            exit 1
          fi
      - name: Validate selection
        env:
          TARGET: ${{ inputs.target }}
          SKILL: ${{ inputs.skill }}
          EVAL_ID: ${{ inputs.eval_id }}
        run: |
          if [ -n "${SKILL}" ] && [ "${TARGET}" = "all" ]; then
            echo "::error::Select an agent target when filtering by skill."
            exit 1
          fi
          if [ -n "${EVAL_ID}" ] && [ -z "${SKILL}" ]; then
            echo "::error::An exact eval ID requires an exact skill name."
            exit 1
          fi
      - name: Install and authenticate Codex CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install -g @openai/codex
          printenv OPENAI_API_KEY | codex login --with-api-key
      - name: Run fresh paired evals
        env:
          TARGET: ${{ inputs.target }}
          SKILL: ${{ inputs.skill }}
          EVAL_ID: ${{ inputs.eval_id }}
        run: |
          args=()
          if [ "${TARGET}" != "all" ]; then args+=(--agent "${TARGET}"); fi
          if [ -n "${SKILL}" ]; then args+=(--skill "${SKILL}"); fi
          if [ -n "${EVAL_ID}" ]; then args+=(--eval "${EVAL_ID}"); fi
          uv run scripts/run_skill_eval.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-runtime-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: tmp/eval-runs/**
