title: Documentation change map
visibility: internal
doc_type: design
stage: dev
owners:
  - documentation-team
related_code:
  - docs/site

change_map:
  "src/catalog/**":
    required_docs:
      - docs/site/api/catalog.md
    trigger: API method, path, parameter, response, or error behavior changes
    exclude:
      - "src/catalog/tests/**"
