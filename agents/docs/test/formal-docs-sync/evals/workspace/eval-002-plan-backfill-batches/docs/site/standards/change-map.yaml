title: 文档变更映射
visibility: internal
doc_type: design
stage: dev
owners:
  - docs
related_code:
  - docs/site
last_verified_version: unverified

# Entry schema:
# change_map:
#   "<repository-relative code_glob>":
#     required_docs:
#       - docs/site/<section>/<page>.md
#     trigger: <when a code change requires documentation review>
#     exclude:
#       - "<optional glob that narrows only this entry>"
change_map:
  "src/api/billing/**":
    required_docs:
      - docs/site/api/billing/index.md
      - docs/site/api/billing/list-invoices.md
      - docs/site/api/index.md
    trigger: Billing route, request, response, or error behavior changes
    exclude:
      - "src/api/billing/internal/**"
    review_policy: billing-owner-approval
  "src/product/analytics/**":
    required_docs:
      - docs/site/api/index.md
      - docs/site/database/index.md
      - docs/site/design/index.md
      - docs/site/ops/index.md
      - docs/site/product/analytics/index.md
      - docs/site/product/analytics/view-dashboard.md
      - docs/site/product/index.md
    trigger: Analytics roles, states, feedback, or recovery behavior changes
  "src/product/workspace_management/**":
    required_docs:
      - docs/site/api/index.md
      - docs/site/database/index.md
      - docs/site/design/index.md
      - docs/site/ops/index.md
      - docs/site/product/index.md
      - docs/site/product/workspace-management/index.md
      - docs/site/product/workspace-management/invitations/index.md
      - docs/site/product/workspace-management/invitations/invitation-acceptance/accept-invitation.md
      - docs/site/product/workspace-management/invitations/invitation-acceptance/index.md
      - docs/site/product/workspace-management/invitations/member-invitations/index.md
      - docs/site/product/workspace-management/invitations/member-invitations/invite-member.md
      - docs/site/product/workspace-management/invitations/member-invitations/manage-pending-invitation.md
    trigger: Workspace management capability, hierarchy, task, permission, feedback, or recovery behavior changes
  "src/product/workspace_management/invitations/**":
    required_docs:
      - docs/site/api/index.md
      - docs/site/database/index.md
      - docs/site/design/index.md
      - docs/site/ops/index.md
      - docs/site/product/index.md
      - docs/site/product/workspace-management/index.md
      - docs/site/product/workspace-management/invitations/index.md
      - docs/site/product/workspace-management/invitations/invitation-acceptance/accept-invitation.md
      - docs/site/product/workspace-management/invitations/invitation-acceptance/index.md
      - docs/site/product/workspace-management/invitations/member-invitations/index.md
      - docs/site/product/workspace-management/invitations/member-invitations/invite-member.md
      - docs/site/product/workspace-management/invitations/member-invitations/manage-pending-invitation.md
    trigger: Invitation feature hierarchy, task, permission, feedback, or recovery behavior changes
  "src/product/workspace_management/invitations/invitation_acceptance.py":
    required_docs:
      - docs/site/api/index.md
      - docs/site/database/index.md
      - docs/site/design/index.md
      - docs/site/ops/index.md
      - docs/site/product/index.md
      - docs/site/product/workspace-management/index.md
      - docs/site/product/workspace-management/invitations/index.md
      - docs/site/product/workspace-management/invitations/invitation-acceptance/accept-invitation.md
      - docs/site/product/workspace-management/invitations/invitation-acceptance/index.md
    trigger: Invitation acceptance result, failure feedback, or recovery behavior changes
  "src/product/workspace_management/invitations/member_invitations.py":
    required_docs:
      - docs/site/api/index.md
      - docs/site/database/index.md
      - docs/site/design/index.md
      - docs/site/ops/index.md
      - docs/site/product/index.md
      - docs/site/product/workspace-management/index.md
      - docs/site/product/workspace-management/invitations/index.md
      - docs/site/product/workspace-management/invitations/member-invitations/index.md
      - docs/site/product/workspace-management/invitations/member-invitations/invite-member.md
      - docs/site/product/workspace-management/invitations/member-invitations/manage-pending-invitation.md
    trigger: Member invitation creation, pending management, permission, limit, feedback, or recovery behavior changes
  "src/support/manual_content/**":
    required_docs:
      - docs/site/ops/index.md
    trigger: Preserve the manually maintained support mapping during Product backfill.
    exclude:
      - "src/support/manual_content/archive/**"
    review_policy: manual-owner-approval
